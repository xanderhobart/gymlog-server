# For someone who just wants to run their own GymLog server: no building, no source code needed.
#
#   1. Save this file (as docker-compose.yml) in an empty folder.
#   2. mkdir -p data && sudo chown 10001:10001 data      <- the server runs as user 10001 and must be allowed to write there
#      docker compose up -d
#   3. docker compose exec gymlog-server python -m app.cli add-user "Me"     <- prints your token, once
#
# Your backups live in the ./data folder next to this file. Back that folder up.
services:
  gymlog-server:
    image: ghcr.io/xanderhobart/gymlog-server:latest
    container_name: gymlog-server
    restart: unless-stopped
    ports:
      - "8080:8080"            # change the left number to use another port on this machine
    environment:
      GYMLOG_KEEP_BACKUPS: ${GYMLOG_KEEP_BACKUPS:-10}
      GYMLOG_USER_QUOTA_MB: ${GYMLOG_USER_QUOTA_MB:-5000}
      GYMLOG_MAX_UPLOAD_MB: ${GYMLOG_MAX_UPLOAD_MB:-500}
    volumes:
      - ./data:/data
